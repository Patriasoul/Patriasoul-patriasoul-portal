name: Apply PatriaSoul Domovina subpage styling

on:
  push:
    paths:
      - '.github/workflows/apply-domovina-style.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply shared Domovina subpage design
        shell: python
        run: |
          from pathlib import Path

          pages = {
            'hrvatska.html': ('hrvatska', '„Kako je dobro i kako je milo kao braća zajedno živjeti!“', 'Psalam 133,1', 'Zagreb.jpg'),
            'gradovi.html': ('gradovi', '„I živjet će svatko pod svojom lozom i pod svojom smokvom, i nitko ih neće plašiti.“', 'Mihej 4,4', 'Split Croatia.jpg'),
            'krajevi-i-geografija.html': ('krajevi', '„Kako su brojna tvoja djela, Gospodine! Sve si to mudro učinio.“', 'Psalam 104,24', 'Relief_map_of_Croatia.png'),
            'priroda.html': ('priroda', '„Njegovo je more, on ga je načinio, i kopno što ga ruke njegove načiniše.“', 'Psalam 95,5', 'Velebit.jpg'),
            'hrvatska-stvara.html': ('hrvatska-stvara', '„Što god činite, činite od srca, kao Gospodinu, a ne ljudima.“', 'Kološanima 3,23', 'Sivi dom.jpg'),
            'dijaspora.html': ('dijaspora', '„Pođite dakle i učinite mojim učenicima sve narode.“', 'Matej 28,19', 'Map_of_the_Croatian_Diaspora_in_the_World_(As_of_13.5.2026.).svg'),
            'istra.html': ('istra', '„Ti pohodi zemlju i napojiš je, obogatiš je veoma.“', 'Psalam 65,10', 'Pula_Arena,_Istria,_Croatia.JPG'),
            'kvarner-i-primorje.html': ('kvarner', '„U njegovoj je ruci život svakoga bića i dah svakoga ljudskog tijela.“', 'Job 12,10', 'Kvarner,_Croatia.JPG'),
            'dalmacija.html': ('dalmacija', '„Onima koji plove morem lađama, koji trguju na velikim vodama, oni vidješe djela Gospodnja.“', 'Psalam 107,23-24', 'Dubrovnik_.jpg'),
            'slavonija-i-baranja.html': ('slavonija', '„Dat ću kišu zemlji vašoj u pravo vrijeme, ranu i kasnu kišu.“', 'Ponovljeni zakon 11,14', 'Kopački_rit_001.jpg'),
            'lika-i-gorski-kotar.html': ('lika', '„Gospodin je moja stijena, tvrđava moja i izbavitelj moj.“', 'Psalam 18,3', 'Velebit_(01)_-_Zavižan.jpg'),
            'zagorje-i-prigorje.html': ('zagorje', '„Mudrost sazida sebi kuću i na sedam stupova je postavi.“', 'Mudre izreke 9,1', 'Trakoscan, Croatia.jpg'),
            'medimurje.html': ('medimurje', '„Kad preko vode prelaziš, s tobom sam; ili preko rijeka, neće te preplaviti.“', 'Izaija 43,2', 'Rijeka_Trnava_(Međimurje,_Croatia).jpg'),
            'podravina-i-bilogora.html': ('podravina', '„Sijač sije riječ.“', 'Marko 4,14', 'Jankovic_Palace_in_Suhopolje_(3).jpg'),
            'posavina-i-pokuplje.html': ('posavina', '„Sve rijeke teku u more, a more ipak nije puno.“', 'Propovjednik 1,7', 'Sisak.jpg'),
          }

          css_path = Path('assets/css/domovina-subpages.css')
          css_path.write_text(r'''/* PatriaSoul · Domovina podstranice */
.domovina-subpage {
  background-color:#f7f4f0;
  background-image:
    linear-gradient(45deg, rgba(196,0,0,.055) 25%, transparent 25%, transparent 75%, rgba(196,0,0,.055) 75%),
    linear-gradient(45deg, rgba(196,0,0,.055) 25%, transparent 25%, transparent 75%, rgba(196,0,0,.055) 75%);
  background-position:0 0, 14px 14px;
  background-size:28px 28px;
}
.domovina-subpage main{background:transparent;}
.domovina-subpage .hero{
  position:relative;
  overflow:hidden;
  min-height:560px;
  display:flex;
  align-items:center;
  background-color:#111;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  color:#fff;
  box-shadow:0 14px 35px rgba(0,0,0,.16);
}
.domovina-subpage .hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,.52) 46%,rgba(0,0,0,.2) 100%);
  pointer-events:none;
}
.domovina-subpage .hero-grid{position:relative;z-index:1;}
.domovina-subpage .hero h1,
.domovina-subpage .hero p,
.domovina-subpage .hero .section-label{color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.35);}
.domovina-subpage .hero-news{background:rgba(255,255,255,.94);color:#171717;border:1px solid rgba(255,255,255,.8);box-shadow:0 12px 30px rgba(0,0,0,.22);}
.domovina-subpage .hero-news h2,
.domovina-subpage .hero-news p,
.domovina-subpage .hero-news span{color:#171717;text-shadow:none;}
.domovina-subpage .content{position:relative;}
.domovina-subpage .content:not(.dark),
.domovina-subpage .news-strip{background:rgba(255,255,255,.97);}
.domovina-subpage .content.dark{background:#171717;}
.domovina-subpage .bible-quote{
  margin:0;
  padding:78px 20px;
  background:rgba(255,255,255,.98);
  border-top:5px solid #c40000;
  border-bottom:1px solid rgba(0,0,0,.08);
  text-align:center;
}
.domovina-subpage .bible-quote .cross{display:block;font-size:2rem;color:#c40000;margin-bottom:18px;}
.domovina-subpage .bible-quote blockquote{max-width:900px;margin:0 auto;color:#222;font-family:Georgia,serif;font-size:clamp(1.35rem,2.5vw,2rem);line-height:1.55;font-weight:600;}
.domovina-subpage .bible-quote cite{display:block;margin-top:18px;color:#777;font-family:inherit;font-style:normal;font-weight:700;letter-spacing:.04em;}
.domovina-subpage .bible-quote .bible-label{display:block;margin-bottom:12px;color:#c40000;font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;}
.domovina-subpage--hrvatska .hero{background-image:url("https://commons.wikimedia.org/wiki/Special:Redirect/file/Zagreb.jpg");}
.domovina-subpage--gradovi .hero{background-image:url("https://commons.wikimedia.org/wiki/Special:Redirect/file/Split_Croatia.jpg");}
.domovina-subpage--krajevi .hero{background-image:url("https://commons.wikimedia.org/wiki/Special:Redirect/file/Relief_map_of_Croatia.png");}
.domovina-subpage--priroda .hero{background-image:url("https://commons.wikimedia.org/wiki/Special:Redirect/file/Velebit.jpg");}
.domovina-subpage--hrvatska-stvara .hero{background-image:url("https://commons.wikimedia.org/wiki/Special:Redirect/file/Sivi_dom.jpg");}
.domovina-subpage--dijaspora .hero{background-image:url("https://commons.wikimedia.org/wiki/Special:Redirect/file/Map_of_the_Croatian_Diaspora_in_the_World_(As_of_13.5.2026.).svg");}
.domovina-subpage--istra .hero{background-image:url("https://commons.wikimedia.org/wiki/Special:Redirect/file/Pula_Arena,_Istria,_Croatia.JPG");}
.domovina-subpage--kvarner .hero{background-image:url("https://commons.wikimedia.org/wiki/Special:Redirect/file/Kvarner,_Croatia.JPG");}
.domovina-subpage--dalmacija .hero{background-image:url("https://commons.wikimedia.org/wiki/Special:Redirect/file/Dubrovnik_.jpg");}
.domovina-subpage--slavonija .hero{background-image:url("https://commons.wikimedia.org/wiki/Special:Redirect/file/Kopački_rit_001.jpg");}
.domovina-subpage--lika .hero{background-image:url("https://commons.wikimedia.org/wiki/Special:Redirect/file/Velebit_(01)_-_Zavižan.jpg");}
.domovina-subpage--zagorje .hero{background-image:url("https://commons.wikimedia.org/wiki/Special:Redirect/file/Trakoscan,_Croatia.jpg");}
.domovina-subpage--medimurje .hero{background-image:url("https://commons.wikimedia.org/wiki/Special:Redirect/file/Rijeka_Trnava_(Međimurje,_Croatia).jpg");}
.domovina-subpage--podravina .hero{background-image:url("https://commons.wikimedia.org/wiki/Special:Redirect/file/Jankovic_Palace_in_Suhopolje_(3).jpg");}
.domovina-subpage--posavina .hero{background-image:url("https://commons.wikimedia.org/wiki/Special:Redirect/file/Sisak.jpg");}
@media(max-width:760px){.domovina-subpage .hero{min-height:620px}.domovina-subpage .hero-grid{padding-top:34px;padding-bottom:34px}.domovina-subpage .bible-quote{padding:58px 18px}}
''', encoding='utf-8')

          for filename, (slug, quote, reference, image) in pages.items():
              p = Path(filename)
              if not p.exists():
                  continue
              html = p.read_text(encoding='utf-8')
              if 'domovina-subpage' not in html:
                  html = html.replace('<body>', f'<body class="domovina-subpage domovina-subpage--{slug}">', 1)
              if '/assets/css/domovina-subpages.css' not in html:
                  html = html.replace('</head>', '  <link rel="stylesheet" href="/assets/css/domovina-subpages.css">\n</head>', 1)
              if '<section class="bible-quote"' not in html:
                  quote_html = f'''<section class="bible-quote" aria-label="Biblijski citat"><div class="wrap"><span class="cross">✝</span><span class="bible-label">Riječ Božja</span><blockquote>{quote}</blockquote><cite>{reference}</cite></div></section>'''
                  html = html.replace('</main>', quote_html + '</main>', 1)
              p.write_text(html, encoding='utf-8')

          wf = Path('.github/workflows/apply-domovina-style.yml')
          if wf.exists():
              wf.unlink()

      - name: Commit changes
        run: |
          git config user.name "PatriaSoul Bot"
          git config user.email "patriasoul@users.noreply.github.com"
          git add assets/css/domovina-subpages.css *.html .github/workflows/apply-domovina-style.yml
          git diff --cached --quiet && exit 0
          git commit -m "Unify Domovina subpages with unique heroes and Bible quotes"
          git push
